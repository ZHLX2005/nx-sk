name: Publish to npm

# push 到 main 即发布。改 package.json 的 version 就等于「准备发版」。
on:
  push:
    branches: [main]

permissions:
  contents: write   # 写 tag 需要
  id-token: write   # --provenance 签名需要（OIDC）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须 0：浅克隆下 git rev-parse <tag> 查不到历史 tag，会重复打 tag
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 不另外指定 version —— pnpm/action-setup 会读 package.json 的 packageManager，
      # 两边都写反而容易不一致
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

      - name: 读版本号
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 已存在则跳过（幂等）
        id: check
        run: |
          if git rev-parse "${{ steps.pkg.outputs.tag }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi
          if npm view ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} version >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 缺 NPM_TOKEN 时明确提示（而不是静默失败）
        if: steps.check.outputs.published == 'false' && secrets.NPM_TOKEN == ''
        run: |
          echo "::warning::仓库缺少 NPM_TOKEN，已跳过发布。"
          echo "补上：gh secret set NPM_TOKEN --body <Automation Token>"
          echo "或改用 OIDC 可信发布（npm 侧配置 Trusted Publisher，无需长期令牌）。"

      - name: 打 tag
        if: steps.check.outputs.tag_exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.pkg.outputs.tag }}" -m "Release ${{ steps.pkg.outputs.tag }}"
          git push origin "${{ steps.pkg.outputs.tag }}"

      - name: 发布
        if: steps.check.outputs.published == 'false' && secrets.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
